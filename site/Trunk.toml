[build]
target = "index.html"
dist = "dist"
# Emit hashed filenames so deployed assets can be cached indefinitely.
filehash = true

[tools]
# Pinned so builds do not depend on whatever wasm-opt happens to be on PATH;
# a stale binaryen there will reject the wasm features current rustc emits.
# No binaryen infers `bulk-memory-opt` from the target-features section, so the
# release build also passes `--enable-bulk-memory-opt` (see index.html).
wasm_opt = "version_132"

[watch]
watch = ["index.html", "src", "styles", "public"]
ignore = ["dist", "target"]

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false
