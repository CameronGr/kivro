[package]
name = "kivro-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
authors = ["Cameron"]
repository = "https://github.com/CameronGr/kivro"
description = "Documentation website for kivro"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = {version = "0.3", features = [ "Clipboard",
 "CssStyleDeclaration",
 "Document",
 "DomRect",
 "DomTokenList",
 "Element",
 "Event",
 "EventTarget",
 "HtmlElement",
 "HtmlInputElement",
 "HtmlTextAreaElement",
 "IntersectionObserver",
 "IntersectionObserverEntry",
 "IntersectionObserverInit",
 "KeyboardEvent",
 "History",
 "Location",
 "MouseEvent",
 "Navigator",
 "Node",
 "ScrollBehavior",
 "ScrollToOptions",
 "Window",]}

console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
