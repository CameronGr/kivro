<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>kivro — secrets in the OS keyring, not in .env</title>
        <meta
            name="description"
            content="kivro keeps the list of secrets a project needs in a committed manifest and the values in the OS credential store, injecting them straight into the process that needs them."
        />

        <link data-trunk rel="tailwind-css" href="input.css" />
        <!-- rustc emits `memory.copy` under `+bulk-memory`, but binaryen gates it
             behind the separate `bulk-memory-opt` feature and will not infer it
             from the wasm target-features section. Without this, wasm-opt fails
             to validate its own input on a release build. -->
        <link
            data-trunk
            rel="rust"
            data-wasm-opt="z"
            data-wasm-opt-params="--enable-bulk-memory-opt"
        />
        <link data-trunk rel="copy-dir" href="public" />

        <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
    </head>
    <body class="bg-black"></body>
</html>
