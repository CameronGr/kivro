[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["examples/rust-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
authors = ["Cameron"]
repository = "https://github.com/CameronGr/kivro"

[workspace.dependencies]
kivro-core = { path = "crates/kivro-core", version = "0.1.0" }
kivro-manifest = { path = "crates/kivro-manifest", version = "0.1.0" }
kivro-keyring = { path = "crates/kivro-keyring", version = "0.1.0" }
kivro-crypto = { path = "crates/kivro-crypto", version = "0.1.0" }
kivro-sync = { path = "crates/kivro-sync", version = "0.1.0" }
kivro = { path = "crates/kivro", version = "0.1.0" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.0"
thiserror = "1.0"
zeroize = "1.7"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
